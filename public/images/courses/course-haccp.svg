<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1C2F" />
      <stop offset="100%" stop-color="#1A2D4A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FD761A" />
      <stop offset="100%" stop-color="#FF964A" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="700" cy="80" r="180" fill="#FD761A" opacity="0.08" />
  <circle cx="100" cy="380" r="140" fill="#2563EB" opacity="0.06" />
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>
  <!-- Central Badge Icon -->
  <g transform="translate(350, 140)">
    <rect x="-60" y="-60" width="120" height="120" rx="28" fill="url(#accent)" opacity="0.15" />
    <rect x="-48" y="-48" width="96" height="96" rx="20" fill="url(#accent)" />
    <!-- Shield / HACCP icon -->
    <path d="M-18 -20 L18 -20 C18 -20 22 6 0 28 C-22 6 -18 -20 -18 -20 Z" fill="#ffffff" />
    <path d="M-8 4 L-2 10 L10 -4" fill="none" stroke="#FD761A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Text -->
  <text x="400" y="270" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="1">SISTEMA HACCP AVANZADO</text>
  <text x="400" y="305" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Inocuidad Alimentaria &amp; Puntos Críticos de Control</text>
  <rect x="340" y="335" width="120" height="28" rx="14" fill="#FD761A" opacity="0.2" />
  <text x="400" y="354" fill="#FD761A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CERTIFICACIÓN OFICIAL</text>
</svg>